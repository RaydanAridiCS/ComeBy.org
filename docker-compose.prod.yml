# Production stack: the app + PostgreSQL on one server.
# Works as-is with `docker compose -f docker-compose.prod.yml up -d --build`,
# or as a "Docker Compose" resource in Coolify. See docs/deployment.md.
name: comeby-prod

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://comeby.org}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: ${NEXT_PUBLIC_GOOGLE_AUTH_ENABLED:-false}
        NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL:-}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
        S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://comeby:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/comeby
    ports:
      - "3000:3000"
    volumes:
      # Only used when STORAGE_PROVIDER=local.
      - uploads:/app/.data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: comeby
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: comeby
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comeby -d comeby"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  uploads:
