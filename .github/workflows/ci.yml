name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - name: Dependency audit (high severity, production dependencies)
        run: pnpm audit --prod --audit-level=high
      - name: Migrations match the schema
        run: |
          pnpm drizzle-kit check
          pnpm drizzle-kit generate
          git diff --exit-code drizzle || (echo "Schema changed without a migration. Run pnpm run db:generate." && exit 1)
          test -z "$(git ls-files --others --exclude-standard drizzle)" || (echo "Untracked migration files were generated. Run pnpm run db:generate and commit them." && exit 1)
      - run: pnpm run typecheck
        env:
          SKIP_ENV_VALIDATION: "1"
      - run: pnpm run check:contrast
      - run: pnpm run test:coverage
      - run: pnpm run build
        env:
          SKIP_ENV_VALIDATION: "1"
          SKIP_STARTUP_TASKS: "1"

  integration:
    name: Integration tests (real Postgres)
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: comeby
          POSTGRES_PASSWORD: comeby
          POSTGRES_DB: comeby
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U comeby" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:integration

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: comeby
          POSTGRES_PASSWORD: comeby
          POSTGRES_DB: comeby
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U comeby" --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgres://comeby:comeby@localhost:5432/comeby
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      EMAIL_PROVIDER: smtp
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      ADMIN_EMAILS: e2e-admin@example.com
      E2E_ADMIN_EMAIL: e2e-admin@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      - name: Start app
        run: pnpm start &
      - run: pnpm dlx wait-on http://localhost:3000/api/health --timeout 60000
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
