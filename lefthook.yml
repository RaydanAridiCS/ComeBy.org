# Git hooks managed by Lefthook (https://lefthook.dev).
# Installed automatically by `npm install` (see the "prepare" script).

pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{ts,tsx,json,jsonc,css}"
      run: npx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    - name: typecheck
      glob: "*.{ts,tsx}"
      run: npm run typecheck

commit-msg:
  jobs:
    - name: commitlint
      run: npx commitlint --edit {1}
